<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل المستشارين النفسيين - منصة سكينة</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header id="site-header"></header>

    <main class="container" style="padding-top: 40px; padding-bottom: 50px;">
        <div style="text-align: center; max-width: 650px; margin: 0 auto 30px;">
            <div class="pill-badge" style="margin-bottom: 10px;">
                <span>🛡️</span>
                <span>جميع البيانات والسير الذاتية موثقة من قبل الإدارة</span>
            </div>
            <h1 class="section-title">🩺 دليل المستشارين والأخصائيين النفسيين</h1>
            <p class="section-subtitle">اختر المختص المناسب لحالتك وأرسل طلب تواصل أولي أو تواصل مباشرة بكل سرية</p>
        </div>

        <!-- شريط البحث -->
        <div style="max-width: 560px; margin: 0 auto 36px; display: flex; gap: 10px;">
            <input type="text" id="sp-search-input" oninput="renderSpecialists()" class="form-control"
                placeholder="ابحث باسم المستشار أو التخصص (مثال: القلق، الاحتراق، الأسري)...">
            <button type="button" onclick="renderSpecialists()" class="btn btn-primary">بحث</button>
        </div>

        <!-- شبكة عرض المختصين -->
        <div id="specialists-grid" class="grid-3"></div>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        /* ==============================================================
           عرض وتصفية دليل المستشارين المعتمدين
           ============================================================== */
        document.addEventListener('DOMContentLoaded', renderSpecialists);

        function renderSpecialists() {
            const data = getSakinaData();
            const query = document.getElementById('sp-search-input').value.trim().toLowerCase();

            // عرض المستشارين المعتمدين فقط ومطابقتهم مع نص البحث
            const list = data.specialists.filter(sp => {
                if (!sp.is_approved) return false;
                if (!query) return true;
                return sp.name.toLowerCase().includes(query) ||
                       sp.specialty.toLowerCase().includes(query) ||
                       sp.bio.toLowerCase().includes(query);
            });

            const grid = document.getElementById('specialists-grid');
            if (list.length === 0) {
                grid.innerHTML = `<div class="card" style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">لا توجد نتائج مطابقة لبحثك حالياً.</div>`;
                return;
            }

            grid.innerHTML = list.map(sp => `
                <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                        <div style="display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px;">
                            <div style="width: 54px; height: 54px; border-radius: 16px; background: var(--sakina-100); display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0;">
                                👨‍⚕️
                            </div>
                            <div>
                                <span class="badge badge-sakina">${sp.title}</span>
                                <h2 style="font-size: 18px; font-weight: 800; color: var(--sakina-800); margin-top: 4px;">${sp.name}</h2>
                                <p style="font-size: 12px; font-weight: 700; color: #B45309;">${sp.specialty}</p>
                            </div>
                        </div>

                        <p style="font-size: 13px; color: #4B5563; margin-bottom: 14px;">${sp.bio}</p>

                        ${sp.certificates ? `
                            <div style="padding: 10px 12px; border-radius: 12px; background: var(--cream-50); border: 1px solid var(--cream-200); font-size: 12px; color: #4B5563; margin-bottom: 14px;">
                                <strong style="color: var(--sakina-800);">🎓 الشهادات:</strong> ${sp.certificates}
                            </div>
                        ` : ''}
                    </div>

                    <div style="padding-top: 14px; border-top: 1px solid var(--cream-100); display: flex; flex-direction: column; gap: 8px;">
                        <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); font-weight: 700;">
                            <span>الخبرة العملية</span>
                            <span style="color: var(--sakina-700);">${sp.experience_years} سنوات</span>
                        </div>
                        <button type="button" onclick="openConsultationModal(${sp.id})" class="btn btn-primary btn-sm btn-block" style="padding: 10px;">
                            📩 طلب تواصل / حجز أولي
                        </button>
                        <div class="grid-2" style="gap: 8px;">
                            <a href="tel:${sp.contact_phone}" class="btn btn-secondary btn-sm">📞 ${sp.contact_phone}</a>
                            <a href="https://wa.me/967${sp.contact_phone}" target="_blank" class="btn btn-sm" style="background: #ECFDF5; color: #047857; border: 1px solid #A7F3D0;">💬 واتساب</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
